name: Keep Supabase Alive

on:
  schedule:
    - cron: '17 2 * * *'   # roz 02:17 UTC (07:17 PKT), off-peak minute taake GitHub delay kam ho
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Query Supabase database
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -uo pipefail

          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "::error::Secrets missing: VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY"
            exit 1
          fi

          TABLES="contact_messages quote_requests"

          ping_table() {
            curl --silent --output /tmp/resp.txt --write-out "%{http_code}" \
              --retry 3 --retry-delay 10 \
              --connect-timeout 10 --max-time 30 \
              -H "apikey: $SUPABASE_ANON_KEY" \
              "$SUPABASE_URL/rest/v1/$1?select=id&limit=1" || echo "000"
          }

          for attempt in 1 2 3; do
            echo "=== Attempt $attempt ==="
            for t in $TABLES; do
              STATUS=$(ping_table "$t")
              echo "$t -> HTTP $STATUS"
              if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ]; then
                echo "Success: database reached via table '$t'."
                exit 0
              fi
            done
            echo "All tables failed on attempt $attempt. Last response:"
            head -c 300 /tmp/resp.txt || true
            echo
            [ "$attempt" -lt 3 ] && sleep 30
          done

          echo "::error::Supabase DB check failed 3 times. Project paused ho sakta hai, dashboard check karo."
          exit 1

      - name: Refresh workflow (stop GitHub 60-day auto-disable)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable "${{ github.workflow }}" --repo "${{ github.repository }}" || true