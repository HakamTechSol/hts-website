name: Keep Supabase Alive

on:
  schedule:
    # Runs every 3 days at 00:00 UTC to prevent Supabase auto-pausing
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Auth health endpoint
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://ffileadkgcrmeuwwinsb.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_RmlKYCKpllbYwl1Zf7-Opg_8DHUQAeZ' }}
        run: |
          set -euo pipefail

          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "SUPABASE_URL and SUPABASE_ANON_KEY must be configured."
            exit 1
          fi

          echo "Checking Supabase at $SUPABASE_URL ..."
          STATUS=$(curl --silent --show-error --output /dev/null --write-out "%{http_code}" \
            --retry 5 --retry-all-errors --retry-delay 5 \
            --connect-timeout 10 --max-time 30 \
            -H "apikey: $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/auth/v1/health")
          echo "Supabase response HTTP Status: $STATUS"
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
            echo "Supabase health check failed with HTTP $STATUS."
            exit 1
          fi
          echo "Supabase health check succeeded."
